[project]
name = "gcb-bulk-tester"
version = "0.1.0"
description = "Bulk benchmark tester for Great Commission Benchmark - leadership tool for retesting all models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Great Commission Benchmark", email = "team@greatcommissionbenchmark.ai"}
]

dependencies = [
    "httpx>=0.28.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

# Note: gcb-runner must also be installed (pip install -e ../gcb-runner)
# It is a sibling directory dependency, not published to PyPI.

[project.scripts]
gcb-bulk-test = "bulk_tester.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bulk_tester"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
