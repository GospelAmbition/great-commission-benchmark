name: Enable native auto-merge

# Trusted default-branch workflow only. Never checkout PR code, download artifacts,
# run PR scripts, or interpolate PR titles/bodies into executable commands here.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  workflow_dispatch:

permissions: {}

jobs:
  enable:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Enable squash auto-merge on ready PRs targeting main
        shell: bash
        run: |
          set -euo pipefail
          # Dispatch also repairs opt-in for any already-open ready PRs. No PR
          # source, secrets, caches, or artifacts are consumed by this workflow.
          prs=$(gh pr list --repo "$GH_REPO" --base main --state open --limit 1000 --json number,isDraft,headRefOid)
          mapfile -t numbers < <(jq -r --arg sha "$HEAD_SHA" '.[] | select(.isDraft == false and ($sha == "" or .headRefOid == $sha)) | .number' <<< "$prs")
          for number in "${numbers[@]}"; do
            pr=$(gh api "repos/$GH_REPO/pulls/$number")
            if [[ $(jq -r '.state == "open" and .draft == false and .base.ref == "main" and .auto_merge == null' <<< "$pr") != true ]]; then
              continue
            fi
            head_sha=$(jq -r .head.sha <<< "$pr")
            # Queue native auto-merge, or merge an already-green PR under the
            # same branch protection. Never use --admin or bypass checks.
            # Matching the inspected head prevents merging an unseen update.
            gh pr merge "$number" --repo "$GH_REPO" --auto --squash --match-head-commit "$head_sha"
          done
