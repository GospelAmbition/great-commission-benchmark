services:
  postgres:
    image: postgres:16
    container_name: benchmark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-benchmark}
      POSTGRES_USER: ${POSTGRES_USER:-benchmark_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-KYDQcZNlKEoU4etGsKR6xd2DN}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-benchmark_user} -d ${POSTGRES_DB:-benchmark}"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - benchmark-network

volumes:
  postgres_data:
    driver: local

networks:
  benchmark-network:
    driver: bridge
