# Great Commission Benchmark Configuration

# LLM Provider Settings
llm:
  provider: lmstudio
  base_url: http://localhost:1234/v1
  api_key: lm-studio  # LM Studio accepts any string
  
  # Model for testing (whatever is loaded in LM Studio)
  test_model: local-model
  
  # Model for evaluating responses (can be same or different)
  evaluator_model: local-model

# Database Settings
database:
  path: gcb.db

# PromptFoo Settings
promptfoo:
  output_dir: prompts
  results_dir: output

# Evaluation Settings
evaluation:
  # Temperature for evaluation LLM (low for consistency)
  temperature: 0.1
  max_tokens: 500

